name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q BetterMountHud.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build
        working-directory: BetterMountHud
        run: |
          chmod +x ./gradlew
          ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: betterMountHud
          path: BetterMountHud/build/libs/
          if-no-files-found: error
